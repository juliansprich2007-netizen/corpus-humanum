<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Anatomie auf Latein lernen: Knochen, Gelenke, Muskeln, Sehnen und Bänder im 3D-Modell, mit Karteikarten und Abfrage.">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Corpus Humanum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400;1,600&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Atlas-Tafel links (Skelett), Arbeitsfläche rechts; auf dem Handy untereinander */
:root{
  --bg:#eceae4; --panel:#f7f6f2; --plate:#2f3233; --plate-ink:#d9d6cc;
  --fg:#1f2324; --muted:#5f6564; --line:#d3d0c7;
  --bone:#e6c98f; --bone-edge:#b89a5e; --cart:#bcd6dc; --skin:#3c4142; --hole:#2f3233;
  --c-bones:#b07a1c; --c-joints:#167a74; --c-muscles:#b2412f; --c-ligaments:#6a4fa3; --c-terms:#4a5a6a;
  --accent:#167a74; --good:#2f7d3a; --bad:#b2412f; --good-bg:#e1efe0; --bad-bg:#f6e2dd;
  --f-display:"Spectral",Georgia,serif; --f-label:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Barlow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1c1d; --panel:#232627; --plate:#2a2d2e; --plate-ink:#c9c5b9; --fg:#ebe8e0; --muted:#a3a7a4; --line:#3a3e3f;
  --skin:#363a3b; --hole:#2a2d2e; --c-bones:#e0a84a; --c-joints:#3fb8ae; --c-muscles:#e2705c; --c-ligaments:#a98be0; --c-terms:#8fa3b8;
  --accent:#3fb8ae; --good:#6cc177; --bad:#ec7b67; --good-bg:#203325; --bad-bg:#3a2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1c1d; --panel:#232627; --plate:#2a2d2e; --plate-ink:#c9c5b9; --fg:#ebe8e0; --muted:#a3a7a4; --line:#3a3e3f;
  --skin:#363a3b; --hole:#2a2d2e; --c-bones:#e0a84a; --c-joints:#3fb8ae; --c-muscles:#e2705c; --c-ligaments:#a98be0; --c-terms:#8fa3b8;
  --accent:#3fb8ae; --good:#6cc177; --bad:#ec7b67; --good-bg:#203325; --bad-bg:#3a2420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.brand h1{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:2rem;margin:0;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase;font-size:.85rem}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 16px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-label);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.85rem;padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--cc,var(--fg));background:color-mix(in srgb,var(--cc,var(--fg)) 14%,transparent)}
.label{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
.lat{font-family:var(--f-display);font-style:italic}
select,input[type=text]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);max-width:100%}
.btn{border:1px solid var(--fg);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.plate{background:var(--plate);border-radius:14px;padding:12px;position:relative;color:var(--plate-ink)}
/* 3D-Viewer */
.viewer{display:flex;flex-direction:column;gap:8px}
.v-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:1px solid #ffffff2a;border-radius:999px;overflow:hidden}
.seg button{background:transparent;color:var(--plate-ink);border:0;padding:6px 13px;cursor:pointer;font-family:var(--f-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
.seg button[aria-pressed="true"]{background:var(--plate-ink);color:var(--plate)}
.v-layers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.v-layers::before{content:"Ebenen";font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;opacity:.6;margin-right:2px}
.v-layers button,.v-iso-btn{font-family:var(--f-label);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:.78rem;padding:4px 11px;border-radius:999px;border:1px solid #ffffff33;background:transparent;color:var(--plate-ink);cursor:pointer}
.v-layers button[aria-pressed="true"]{background:#ffffff1f;border-color:#ffffff66}
.v-layers button[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.v-iso-btn{background:var(--plate-ink);color:var(--plate);border-color:var(--plate-ink)}
.v-stage{position:relative;width:100%;height:min(74vh,800px);min-height:460px;overflow:hidden;border-radius:10px;background:radial-gradient(ellipse at 50% 30%,#4b5154 0%,#2c3032 52%,#1b1d1e 100%)}
.v-stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.v-stage canvas:active{cursor:grabbing}
.v-label{position:absolute;left:0;top:0;pointer-events:none;background:var(--plate-ink);color:var(--plate);font-family:var(--f-display);font-style:italic;font-weight:600;font-size:.98rem;padding:3px 11px;border-radius:6px;white-space:nowrap;box-shadow:0 4px 14px #0007}
.v-tip{position:absolute;left:0;top:0;pointer-events:none;background:#101213e6;color:#f1ede4;padding:6px 10px;border-radius:8px;font-size:.82rem;display:flex;flex-direction:column;max-width:260px;box-shadow:0 6px 18px #0008}
.v-tip b{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:.98rem}
.v-tip span{opacity:.75}
.v-load{position:absolute;left:16px;right:16px;bottom:16px;display:grid;gap:6px;font-size:.85rem}
.v-load-b{height:4px;border-radius:2px;background:#ffffff22;overflow:hidden}.v-load-b i{display:block;height:100%;width:0;background:var(--plate-ink);transition:width .2s}
.v-iso{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#0009;padding:6px 8px 6px 12px;border-radius:10px;font-family:var(--f-display);font-style:italic}
.v-iso-x{font:600 .78rem var(--f-label);letter-spacing:.05em;text-transform:uppercase;font-style:normal;border:0;border-radius:999px;padding:5px 11px;background:var(--plate-ink);color:var(--plate);cursor:pointer}
.v-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem}
.v-hint{opacity:.7}
.v-credit{font-size:.7rem;opacity:.5;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.detail h2{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.8rem;margin:2px 0 0;line-height:1.15;text-wrap:balance}
.detail .de{font-size:1.1rem;color:var(--muted);margin:2px 0 12px}
.detail dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.detail dt{font-family:var(--f-label);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--muted);padding-top:2px}
.detail dd{margin:0}
.mn{margin-top:12px;padding:10px 12px;border-left:3px solid var(--cc,var(--accent));background:color-mix(in srgb,var(--cc,var(--accent)) 9%,transparent);border-radius:0 8px 8px 0;font-size:.93rem}
.catbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--cc)}
.catbadge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
.list{margin-top:14px;max-height:420px;overflow:auto;border-top:1px solid var(--line)}
.list h4{font-family:var(--f-label);letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted);margin:12px 0 4px;position:sticky;top:0;background:var(--panel);padding:2px 0}
.list button{display:flex;width:100%;text-align:left;gap:10px;justify-content:space-between;align-items:baseline;background:none;border:0;border-radius:6px;padding:5px 8px;cursor:pointer;color:var(--fg)}
.list button:hover,.list button.on{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.list button .lat{font-size:1.02rem}
.list button small{color:var(--muted);text-align:right}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input[type=text]{flex:1 1 180px}
/* Karteikarten */
.card-stage{perspective:1400px;max-width:620px;margin:0 auto}
.card{position:relative;min-height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:8px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 30px -18px #0006;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .big{font-family:var(--f-display);font-size:2.1rem;line-height:1.15;text-wrap:balance}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.card-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.boxes{display:flex;gap:6px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.boxes span{font-family:var(--f-label);font-size:.8rem;letter-spacing:.05em;padding:3px 9px;border-radius:6px;background:color-mix(in srgb,var(--fg) 7%,transparent);font-variant-numeric:tabular-nums}
.kbd{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}
/* Quiz */
.setup{display:grid;gap:14px}
.setup .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.q-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.progress{height:6px;border-radius:3px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-prompt{font-size:1.05rem;color:var(--muted);margin-bottom:4px}
.q-term{font-family:var(--f-display);font-size:1.9rem;line-height:1.2;margin-bottom:16px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt kbd{font-family:var(--f-label);color:var(--muted);margin-right:8px}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.95rem}
.feedback.ok{background:var(--good-bg)} .feedback.no{background:var(--bad-bg)}
.typebox{display:flex;gap:8px;flex-wrap:wrap} .typebox input{flex:1 1 220px;font-size:1.1rem}
.score{font-family:var(--f-display);font-size:3rem;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;gap:14px}
.stat-row{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:12px;align-items:center}
@media (max-width:560px){.stat-row{grid-template-columns:minmax(0,1fr) 90px}.stat-row .bar{grid-column:1/-1;order:3}}
.bar{height:12px;border-radius:6px;background:color-mix(in srgb,var(--fg) 9%,transparent);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.num{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--f-label);font-size:.95rem}
.muted{color:var(--muted)}
.wronglist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.wronglist li{padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--fg) 5%,transparent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Corpus Humanum</h1>
      <p>Knochen · Gelenke · Muskeln · Sehnen &amp; Bänder · Fachbegriffe</p>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="atlas" aria-selected="true">Atlas</button>
      <button role="tab" data-tab="learn" aria-selected="false">Lernen</button>
      <button role="tab" data-tab="quiz" aria-selected="false">Abfrage</button>
      <button role="tab" data-tab="stats" aria-selected="false">Fortschritt</button>
    </nav>
  </header>

  <!-- ATLAS -->
  <section id="tab-atlas">
    <div class="toolbar">
      <div class="chips" id="atlas-cats"></div>
      <input type="text" id="atlas-search" placeholder="Suchen: z. B. Femur, Kniescheibe, Bizeps …">
    </div>
    <div class="grid">
      <div class="plate" id="atlas-plate"></div>
      <div class="panel">
        <div class="detail" id="atlas-detail"></div>
        <div class="list" id="atlas-list"></div>
      </div>
    </div>
  </section>

  <!-- LERNEN -->
  <section id="tab-learn" hidden>
    <div class="panel" style="margin-bottom:18px">
      <div class="setup">
        <div class="row"><span class="label" style="min-width:90px">Thema</span><div class="chips" id="learn-cats"></div></div>
        <div class="row"><span class="label" style="min-width:90px">Region</span><select id="learn-region"></select>
          <span class="label" style="margin-left:12px">Vorderseite</span>
          <select id="learn-dir"><option value="lat">Latein zeigen</option><option value="de">Deutsch zeigen</option></select>
          <label style="display:flex;gap:6px;align-items:center;margin-left:12px"><input type="checkbox" id="learn-onlynew"> nur noch nicht gekonnte</label>
        </div>
      </div>
    </div>
    <div id="learn-area"></div>
  </section>

  <!-- ABFRAGE -->
  <section id="tab-quiz" hidden>
    <div id="quiz-setup" class="panel">
      <div class="setup">
        <div class="row"><span class="label" style="min-width:90px">Thema</span><div class="chips" id="quiz-cats"></div></div>
        <div class="row"><span class="label" style="min-width:90px">Region</span><select id="quiz-region"></select></div>
        <div class="row"><span class="label" style="min-width:90px">Fragetyp</span><div class="chips" id="quiz-modes"></div></div>
        <div class="row"><span class="label" style="min-width:90px">Anzahl</span>
          <select id="quiz-n"><option>10</option><option selected>20</option><option>30</option><option value="999">Alle</option></select>
          <span class="muted" id="quiz-pool"></span>
        </div>
        <div class="row"><button class="btn" id="quiz-start">Abfrage starten</button></div>
      </div>
    </div>
    <div id="quiz-run" hidden>
      <div class="grid" id="quiz-grid">
        <div class="plate" id="quiz-plate"></div>
        <div class="panel" id="quiz-panel"></div>
      </div>
    </div>
  </section>

  <!-- FORTSCHRITT -->
  <section id="tab-stats" hidden>
    <div class="panel">
      <div class="stats" id="stats"></div>
      <p class="muted" style="margin-top:18px;font-size:.9rem">„Gekonnt“ heißt: in Karteikarten oder Abfrage mindestens dreimal hintereinander richtig. Der Fortschritt wird nur in diesem Browser gespeichert.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost" id="reset">Fortschritt zurücksetzen</button><span id="reset-confirm" hidden><button class="btn bad" id="reset-yes">Ja, alles löschen</button> <button class="btn ghost" id="reset-no">Abbrechen</button></span></div>
    </div>
  </section>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js"
}}
</script>
<script type="module">
/* ================= DATEN =================
   Positionen (x,y) beziehen sich auf die Skelett-Zeichnung (viewBox 0 0 300 665).
   view: a = Ansicht von vorne, p = von hinten. Fehlt x, gibt es keinen Punkt auf der Figur. */
const CATS = {
  bones:{name:'Knochen',color:'--c-bones'},
  joints:{name:'Gelenke',color:'--c-joints'},
  muscles:{name:'Muskeln',color:'--c-muscles'},
  ligaments:{name:'Sehnen & Bänder',color:'--c-ligaments'},
  terms:{name:'Fachbegriffe',color:'--c-terms'}
};
const ITEMS = [];
function add(cat, rows, map){ rows.forEach(r=>{ const o = map(r); o.cat=cat; o.id=cat+'-'+ITEMS.length; ITEMS.push(o); }); }

// Knochen: [Latein, Deutsch, Region, x, y, Ansicht, Info, Merkhilfe]
add('bones',[
 ['Cranium','Schädel','Schädel',150,22,'a','Besteht aus Hirnschädel (Neurocranium) und Gesichtsschädel (Viscerocranium); insgesamt 22 Knochen (ohne Gehörknöchelchen).'],
 ['Os frontale','Stirnbein','Schädel',150,32,'a','Bildet die Stirn und das Dach der Augenhöhlen.'],
 ['Os parietale','Scheitelbein','Schädel',171,30,'a','Paariger Knochen des Schädeldachs, verbunden über die Pfeilnaht (Sutura sagittalis).'],
 ['Os temporale','Schläfenbein','Schädel',178,58,'a','Enthält Mittel- und Innenohr; trägt den Processus mastoideus (Warzenfortsatz).'],
 ['Os occipitale','Hinterhauptbein','Schädel',150,42,'p','Umschließt das Foramen magnum, durch das das Rückenmark austritt.'],
 ['Os sphenoidale','Keilbein','Schädel',172,66,'a','Zentraler Schädelbasisknochen; trägt die Sella turcica (Türkensattel) mit der Hypophyse.'],
 ['Os ethmoidale','Siebbein','Schädel',150,57,'a','Liegt zwischen den Augenhöhlen; Siebplatte (Lamina cribrosa) für die Riechfäden.'],
 ['Os nasale','Nasenbein','Schädel',150,66,'a','Paariger kleiner Knochen des Nasenrückens.'],
 ['Os lacrimale','Tränenbein','Schädel',156,62,'a','Kleinster Gesichtsknochen, in der inneren Augenhöhlenwand.'],
 ['Os zygomaticum','Jochbein','Schädel',168,72,'a','Wangenknochen; bildet mit dem Os temporale den Jochbogen (Arcus zygomaticus).'],
 ['Maxilla','Oberkiefer','Schädel',157,80,'a','Trägt die oberen Zähne und bildet den Boden der Augenhöhle; enthält die Kieferhöhle (Sinus maxillaris).'],
 ['Mandibula','Unterkiefer','Schädel',165,93,'a','Einziger beweglicher Schädelknochen; bildet mit dem Os temporale das Kiefergelenk.'],
 ['Os hyoideum','Zungenbein','Hals',150,110,'a','Hufeisenförmiger Knochen ohne gelenkige Verbindung zu anderen Knochen.'],
 ['Atlas (C1)','Erster Halswirbel','Wirbelsäule',150,100,'p','Hat keinen Wirbelkörper; trägt den Schädel.','Atlas trägt in der Sage die Weltkugel – hier den Kopf.'],
 ['Axis (C2)','Zweiter Halswirbel','Wirbelsäule',150,107,'p','Besitzt den Dens axis (Zahn), um den sich der Atlas dreht.'],
 ['Vertebrae cervicales','Halswirbel (C1–C7)','Wirbelsäule',150,119,'a','7 Halswirbel; erkennbar an den Querfortsatzlöchern (Foramina transversaria).','Frühstück um 7, Mittagessen um 12, Abendessen um 5: 7 Hals-, 12 Brust-, 5 Lendenwirbel.'],

/* ================= SPEICHER ================= */
const STORE_KEY='corpus-humanum-v1';
let prog={};
try{ prog=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}; }catch(e){ prog={}; }
function save(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(prog)); }catch(e){} }
function P(id){ return prog[id]||(prog[id]={b:0,r:0,w:0}); }
function mark(id,ok){ const p=P(id); if(ok){p.r++;p.b=Math.min(5,p.b+1);}else{p.w++;p.b=0;} save(); }
const mastered=id=>(prog[id]?.b||0)>=3;

/* ================= HILFEN ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const byId=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const cvar=cat=>`var(${CATS[cat].color})`;
const regionsOf=cats=>[...new Set(ITEMS.filter(i=>cats.includes(i.cat)).map(i=>i.region))];
function detailHTML(it){
  let rows='';
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  rows+=row('Region',it.region);
  if(it.cat==='muscles'){rows+=row('Ursprung',it.o)+row('Ansatz',it.i)+row('Funktion',it.f);}
  if(it.cat==='joints'){rows+=row(it.region==='Gelenktypen'?'Freiheit':it.region==='Gelenkaufbau'?'Art':'Gelenktyp',it.type)+row('Knochen',it.parts);}

const MODES={
  lat2de:{name:'Latein → Deutsch',ok:()=>true},
  de2lat:{name:'Deutsch → Latein',ok:()=>true},

function drawModes(){ const h=$('#quiz-modes'); h.innerHTML=Object.entries(MODES).map(([k,m])=>`<button class="chip" data-k="${k}" aria-pressed="${quizModes.includes(k)}">${m.name}</button>`).join('');
  h.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k,i=quizModes.indexOf(k); if(i>=0){if(quizModes.length>1)quizModes.splice(i,1);}else quizModes.push(k); drawModes(); quizPoolInfo();}); }

$('#quiz-region').onchange=quizPoolInfo; $('#quiz-n').onchange=quizPoolInfo;
function quizBase(){ const r=$('#quiz-region').value; return ITEMS.filter(i=>quizCats.includes(i.cat)&&(!r||i.region===r)); }
function quizPool(){ return quizBase().filter(i=>quizModes.some(m=>MODES[m].ok(i))); }
function quizPoolInfo(){ const n=quizPool().length; $('#quiz-pool').textContent=`${n} Begriffe passen zu deiner Auswahl`; $('#quiz-start').disabled=n<2; }
quizPoolInfo();

let Q=null; let quizFig=null;
$('#quiz-start').onclick=()=>startQuiz(quizPool());
function startQuiz(pool){
  const n=+$('#quiz-n').value;
  // schwächere Begriffe bevorzugen
  const pick=shuffle(pool).sort((a,b)=>((prog[a.id]?.b||0)-(prog[b.id]?.b||0))+(Math.random()-.5)*2).slice(0,Math.min(n,pool.length));
  Q={items:shuffle(pick).map(it=>{ const ms=quizModes.filter(m=>MODES[m].ok(it)); return {id:it.id,mode:ms.length?ms[Math.random()*ms.length|0]:'lat2de'}; }),idx:0,score:0,wrong:[],answered:false,pool:quizBase()};
  $('#quiz-setup').hidden=true; $('#quiz-run').hidden=false;
  quizFig=viewer; viewer.mount($('#quiz-plate'));
  quizNext();
}
function distractors(it,field,k=3){
  const fit=x=>x.id!==it.id&&x.cat===it.cat&&x[field]&&x[field]!==it[field]&&(field!=='type'||x.parts);
  let cands=Q.pool.filter(fit);
  const same=shuffle(cands.filter(x=>x.region===it.region)); const other=shuffle(cands.filter(x=>x.region!==it.region));
  if(cands.length<k){ cands=ITEMS.filter(fit); other.push(...shuffle(cands)); }
  const out=[]; const seen=new Set([it[field]]);
  for(const x of [...same.slice(0,2),...other,...same.slice(2)]){ if(out.length>=k) break; if(!seen.has(x[field])){seen.add(x[field]);out.push(x);} }
  return out;
}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\(.*?\)/g,'').replace(/\b(mm?|lig|ligg|art|artt|os|ossa)\.?\s/g,m=>m.replace('.','')).replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
function quizNext(){
  if(Q.idx>=Q.items.length) return quizEnd();
  const q=Q.items[Q.idx]; const it=byId[q.id]; Q.answered=false;
  const panel=$('#quiz-panel'); const needFig=q.mode==='where'||q.mode==='find';
  $('#quiz-plate').hidden=!needFig; $('#quiz-grid').style.gridTemplateColumns=needFig?'':'minmax(0,1fr)';
  if(viewer.isolated) viewer.isolate(false); quizFig.quiz=true; quizFig.onPick=null; quizFig.target=null; quizFig.expect=null; quizFig.sel=null; quizFig.hideMarkers=false; quizFig.hideLabel=true; quizFig.setLayer('muscle',false); quizFig.resetZoom(true);
  const head=`<div class="q-head"><span class="catbadge" style="--cc:${cvar(it.cat)}">${CATS[it.cat].name} · ${MODES[q.mode].name}</span><span class="num muted">Frage ${Q.idx+1} / ${Q.items.length} · ${Q.score} richtig</span></div><div class="progress"><i style="width:${Q.idx/Q.items.length*100}%"></i></div>`;
  let body='';
  const opts=(list,label)=>`<div class="opts">${list.map((x,k)=>`<button class="opt" data-id="${x.id}" data-v="${esc(label(x))}"><kbd>${k+1}</kbd>${label(x)}</button>`).join('')}</div>`;
  if(q.mode==='lat2de'){ const ch=shuffle([it,...distractors(it,'de')]); body=`<div class="q-prompt">Was bedeutet</div><div class="q-term lat">${esc(it.lat)}</div>`+opts(ch,x=>esc(x.de)); }
  else if(q.mode==='de2lat'){ const ch=shuffle([it,...distractors(it,'lat')]); body=`<div class="q-prompt">Wie heißt auf Latein</div><div class="q-term">${esc(it.de)}</div>`+opts(ch,x=>`<span class="lat">${esc(x.lat)}</span>`); }
  else if(q.mode==='detail'){
    const f=it.cat==='muscles'?'f':'type'; const ch=shuffle([it,...distractors(it,f)]);
    body=`<div class="q-prompt">${it.cat==='muscles'?'Welche Funktion hat':'Welcher Gelenktyp ist'}</div><div class="q-term"><span class="lat">${esc(it.lat)}</span><div class="muted" style="font-size:1rem;font-family:var(--f-body)">${esc(it.de)}</div></div>`+opts(ch,x=>esc(x[f]));
  }
  else if(q.mode==='type'){ body=`<div class="q-prompt">Schreibe den lateinischen Namen von</div><div class="q-term">${esc(it.de)}</div><form class="typebox" id="tform"><input type="text" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="z. B. Os frontale"><button class="btn">Prüfen</button></form><p class="muted" style="font-size:.85rem;margin-top:6px">Klammern und Groß-/Kleinschreibung sind egal. Kleine Tippfehler werden als „fast richtig“ gewertet.</p>`; }
  else if(q.mode==='where'){
    const ch=shuffle([it,...distractors(it,'lat')]);
    quizFig.setItems([it]); quizFig.hideMarkers=true; quizFig.target=it.id; quizFig.select(null); quizFig.zoomToItem(it);
    body=`<div class="q-prompt">Welche Struktur ist im Modell farbig hervorgehoben?</div><div class="q-term" style="font-size:1.1rem;font-family:var(--f-body)">Du kannst das Modell drehen und zoomen.</div>`+opts(ch,x=>`<span class="lat">${esc(x.lat)}</span> <span class="muted">– ${esc(x.de)}</span>`);
  }
  else if(q.mode==='find'){
    const pool=Q.pool.filter(x=>hasFig(x)&&x.cat===it.cat);
    quizFig.setLayer('muscle',it.cat==='muscles'); quizFig.expect=it.id; quizFig.setItems(pool); quizFig.setView(it.view);
    body=`<div class="q-prompt">Klicke im Modell auf</div><div class="q-term"><span class="lat">${esc(it.lat)}</span><div class="muted" style="font-size:1rem;font-family:var(--f-body)">${esc(it.de)}</div></div><p class="muted">Tipp: am besten von <b>${it.view==='a'?'vorne':'hinten'}</b> zu sehen. Du kannst das Modell drehen und zur Maus hin zoomen.</p><div id="find-fb"></div>`;
    quizFig.onPick=(hit)=>{ if(Q.answered) return; if(!hit) return; const ok=hit.id===it.id; quizFig.sel=hit.id; quizFig.target=it.id; quizFig.hideLabel=false; quizFig.renderMarkers(); if(!ok){ quizFig.sel=it.id; quizFig.renderMarkers(); quizFig.zoomToItem(it); } answer(ok, ok?'':`Du hast <span class="lat">${esc(hit.lat)}</span> (${esc(hit.de)}) gewählt.`); };
  }
  panel.innerHTML=head+body+`<div id="q-fb"></div>`;
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(Q.answered) return; const ok=b.dataset.id===it.id;
    panel.querySelectorAll('.opt').forEach(o=>{o.disabled=true; if(o.dataset.id===it.id) o.classList.add('right');}); if(!ok) b.classList.add('wrong');
    if(q.mode==='where'){ quizFig.sel=it.id; quizFig.hideLabel=false; quizFig.renderMarkers(); }
    answer(ok); });
  if(q.mode==='type'){ const inp=$('#tin'); setTimeout(()=>inp.focus(),30); $('#tform').onsubmit=e=>{ e.preventDefault(); if(Q.answered) return; const a=norm(inp.value), t=norm(it.lat); if(!a) return;
    const alts=[t,...it.lat.split('/').map(norm)]; const dist=Math.min(...alts.map(x=>lev(a,x))); const ok=dist===0; const almost=!ok&&dist<=Math.max(1,Math.floor(t.length/8));
    inp.disabled=true; answer(ok||almost, almost?`Fast richtig – genau geschrieben: <span class="lat">${esc(it.lat)}</span>`:''); }; }
}
function answer(ok,extra=''){

    <div class="card-actions" style="justify-content:flex-start"><button class="btn" id="q-next">${Q.idx+1<Q.items.length?'Weiter':'Auswertung'}</button><button class="btn ghost" id="q-quit">Abbrechen</button></div>`;
  $('#q-next').onclick=()=>{Q.idx++;quizNext();}; $('#q-quit').onclick=quizQuit; $('#q-next').focus({preventScroll:true});
}
function quizQuit(){ $('#quiz-run').hidden=true; $('#quiz-setup').hidden=false; quizPoolInfo(); }
function quizEnd(){
  $('#quiz-plate').hidden=true; $('#quiz-grid').style.gridTemplateColumns='minmax(0,1fr)';
  const n=Q.items.length, pct=Math.round(Q.score/n*100);

    ${Q.wrong.length?`<div class="label">Diese solltest du wiederholen</div><ul class="wronglist">${[...new Set(Q.wrong)].map(id=>`<li><span class="lat">${esc(byId[id].lat)}</span> – ${esc(byId[id].de)}</li>`).join('')}</ul>`:''}
    <div class="card-actions" style="justify-content:flex-start;margin-top:16px">${Q.wrong.length?'<button class="btn" id="q-retry">Fehler wiederholen</button>':''}<button class="btn ${Q.wrong.length?'ghost':''}" id="q-again">Neue Abfrage</button></div>`;

function renderStats(){
  const rows=Object.entries(CATS).map(([k,c])=>{ const its=ITEMS.filter(i=>i.cat===k); const m=its.filter(i=>mastered(i.id)).length; const s=its.filter(i=>prog[i.id]&&!mastered(i.id)).length;
    return `<div class="stat-row"><span class="catbadge" style="--cc:${cvar(k)}">${c.name}</span><div class="bar"><i style="width:${m/its.length*100}%;background:${cvar(k)}"></i><i style="width:${s/its.length*100}%;background:${cvar(k)};opacity:.35"></i></div><span class="num">${m} / ${its.length} gekonnt</span></div>`; }).join('');
  const all=ITEMS.length, m=ITEMS.filter(i=>mastered(i.id)).length;
  const weak=ITEMS.filter(i=>prog[i.id]?.w).sort((a,b)=>(prog[b.id].w-prog[b.id].r)-(prog[a.id].w-prog[a.id].r)).slice(0,10);
  $('#stats').innerHTML=`<div><div class="label">Gesamt</div><div class="score">${m} <span class="muted" style="font-size:1.4rem">von ${all} Begriffen gekonnt</span></div></div>${rows}
   <div><div class="label" style="margin-top:8px">Am häufigsten falsch</div>${weak.length?`<ul class="wronglist">${weak.map(i=>`<li><span class="lat">${esc(i.lat)}</span> – ${esc(i.de)} <span class="muted num">(${prog[i.id].w}× falsch, ${prog[i.id].r}× richtig)</span></li>`).join('')}</ul>`:'<p class="muted">Noch keine Fehler – leg mit „Lernen“ oder „Abfrage“ los.</p>'}</div>`;
}
$('#reset').onclick=()=>{$('#reset-confirm').hidden=false;};
$('#reset-no').onclick=()=>{$('#reset-confirm').hidden=true;};
$('#reset-yes').onclick=()=>{prog={};save();$('#reset-confirm').hidden=true;renderStats();};

learnBuild();
try{ const t=localStorage.getItem(STORE_KEY+'-tab'); if(t&&$('#tab-'+t)) showTab(t); }catch(e){}
</script>
